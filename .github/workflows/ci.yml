name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe de todo .js
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
      - name: vercel.json e manifest são JSON válido, com CSP
        run: |
          node -e "const c=require('./vercel.json');const csp=c.headers[0].headers.find(h=>h.key==='Content-Security-Policy');if(!csp||/unsafe-inline|unsafe-eval|\*/.test(csp.value))process.exit(1)"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Testes dos cálculos
        run: npm test
